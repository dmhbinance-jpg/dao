<div class="tnote" style="margin:16px 20px 0">
  <b>只对「从同一个本地服务打开的游戏」有效。</b>存档存在浏览器的 localStorage 里，按网址隔离：
  这一页改的是 <code id="origin"></code> 下的存档，也就是从 <a href="../" target="_blank">这个服务打开的游戏</a>（同时会写到硬盘 saves/）。
  双击 index.html（file://）打开的游戏存档在另一个地方，这里看不到、也改不到。
  先在上面选要改哪个存档位。游戏页开着这个存档位也没关系：这里一改，游戏页会自动重新读入。
</div>
